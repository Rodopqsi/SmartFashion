# Server
server.port=${ADMIN_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smarthfashion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Keep table/column names exactly as defined in SQL
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Thymeleaf
spring.thymeleaf.cache=false

# Simple SSO (hmac-sha256) handoff from Django -> Admin
# Set the same secret in Django to mint tokens. Leave empty to disable.
sso.shared-secret=${SSO_SHARED_SECRET:}
# Token max age seconds
sso.max-age=${SSO_MAX_AGE:60}
# External login URL used when an unauthenticated user hits /admin
sso.login-url=${SSO_LOGIN_URL:http://localhost:8000/admin/login}

# Uploads
app.upload-dir=${UPLOAD_DIR:uploads/}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Webhook (checkout -> admin) simple shared secret
webhook.shared-secret=supersecreto123

# Email notifications (optional)
app.mail.from=${APP_MAIL_FROM:no-reply@smartfashion.local}
app.base-url=${APP_BASE_URL:https://smartfashion.local}
