
server.port=${ADMIN_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smarthfashion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.thymeleaf.cache=false

sso.shared-secret=${SSO_SHARED_SECRET:}

sso.max-age=${SSO_MAX_AGE:60}
sso.login-url=${SSO_LOGIN_URL:http://localhost:8000/admin/login}

app.upload-dir=${UPLOAD_DIR:uploads/}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

webhook.shared-secret=supersecreto123


app.mail.from=${APP_MAIL_FROM:no-reply@smartfashion.local}
app.base-url=${APP_BASE_URL:https://smartfashion.local}

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.default-encoding=UTF-8
