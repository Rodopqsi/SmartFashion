<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(${title}, ~{::section})">
<section>
  <style>
    .grid-two{display:grid;grid-template-columns:2fr 3fr;gap:12px}
    @media(max-width:900px){.grid-two{grid-template-columns:1fr}}
    .grid-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    @media(max-width:700px){.grid-fields{grid-template-columns:1fr}}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--admin-border);border-radius:999px;background:var(--admin-bg-soft)}
    .list{max-height:260px;overflow:auto;border:1px solid var(--admin-border);border-radius:8px}
    .list-item{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(0,0,0,0.04)}
  </style>
  <div class="grid-two">
    <div class="card">
      <h2 th:text="${title}">Colección</h2>
      <form id="collectionForm" method="post" th:action="${item.id} != null ? @{/admin/collections/{id}(id=${item.id})} : @{/admin/collections}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" id="productIds" name="productIds" th:value="${productIds}" />
        <div class="grid-fields">
          <label>Nombre
            <input name="nombre" th:value="${item.nombre}" required />
          </label>
          <label>Slug
            <input name="slug" th:value="${item.slug}" placeholder="amigable-url" />
          </label>
          <label>Imagen (URL)
            <input name="imageUrl" th:value="${item.imageUrl}" />
          </label>
          <label>Orden
            <input name="orden" type="number" th:value="${item.orden}" />
          </label>
          <label style="grid-column:1/-1;display:flex; align-items:center; gap:8px; margin-top:4px;">
            <input type="checkbox" name="activo" th:checked="${item.activo}" /> Activo
          </label>
          <label style="grid-column:1/-1">Descripción
            <textarea name="descripcion" rows="3" th:text="${item.descripcion}"></textarea>
          </label>
        </div>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="btn" type="submit">Guardar</button>
          <a class="btn secondary" th:href="@{/admin/collections}">Volver</a>
        </div>
      </form>
      <div style="display:flex; margin-top:10px;">
        <form th:if="${item.id != null}" th:action="@{'/admin/collections/' + ${item.id} + '/delete'}" method="post" style="margin-left:auto">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button class="btn danger" type="submit" onclick="return confirm('¿Eliminar colección?')">Eliminar</button>
        </form>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Productos de la colección</h3>
      <div class="chips" id="selectedChips" style="margin-bottom:8px"></div>
      <div class="row" style="gap:8px;align-items:flex-end">
        <label style="flex:1">Buscar productos
          <input id="productSearch" placeholder="Nombre o descripción" />
        </label>
        <button class="btn" type="button" id="clearSelection">Limpiar selección</button>
      </div>
      <div class="list" id="searchResults" style="margin-top:8px"></div>
      <p style="font-size:12px;color:#555;margin-top:6px">Consejo: usa el buscador para añadir; haz clic en una chip para quitar. Se guardará en el campo oculto.</p>
    </div>
  </div>

  <div class="card" th:if="${item.imageUrl}" style="margin-top:12px">
    <h3>Preview</h3>
    <img th:src="${item.imageUrl}" alt="preview" style="max-width:100%; height:auto;" />
  </div>

  <script>
    (function(){
      var hidden = document.getElementById('productIds');
      var chips = document.getElementById('selectedChips');
      var results = document.getElementById('searchResults');
      var input = document.getElementById('productSearch');
      var clearBtn = document.getElementById('clearSelection');

      function getIds(){
        var raw = (hidden && hidden.value) ? hidden.value : '';
        return raw.split(',').map(function(s){return s.trim();}).filter(function(s){return /^\d+$/.test(s)});
      }
      function setIds(arr){ hidden.value = arr.join(','); renderChips(); }
      function addId(id){ var set = new Set(getIds()); set.add(String(id)); setIds(Array.from(set)); }
      function removeId(id){ var arr = getIds().filter(function(x){ return x !== String(id); }); setIds(arr); }

      function renderChips(){
        if(!chips) return;
        chips.innerHTML = '';
        getIds().forEach(function(id){
          var div = document.createElement('div');
          div.className = 'chip';
          div.textContent = '#'+id;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = '×';
          btn.style.cssText = 'background:transparent;border:none;cursor:pointer;font-size:14px';
          btn.addEventListener('click', function(){ removeId(id); });
          div.appendChild(btn);
          chips.appendChild(div);
        });
      }

      async function search(q){
        results.innerHTML = '<div class="list-item">Buscando…</div>';
        try{
          var resp = await fetch('/admin/collections/search-products?q=' + encodeURIComponent(q||''));
          var data = await resp.json();
          results.innerHTML = '';
          data.forEach(function(p){
            var row = document.createElement('div');
            row.className = 'list-item';
            var left = document.createElement('div');
            left.textContent = p.nombre + ' (ID ' + p.id + ')';
            var right = document.createElement('div');
            var btn = document.createElement('button');
            btn.className = 'btn';
            btn.type = 'button';
            btn.textContent = 'Añadir';
            btn.addEventListener('click', function(){ addId(p.id); });
            right.appendChild(btn);
            row.appendChild(left); row.appendChild(right);
            results.appendChild(row);
          });
          if(data.length === 0){ results.innerHTML = '<div class="list-item">Sin resultados</div>'; }
        }catch(e){ results.innerHTML = '<div class="list-item">Error al buscar</div>'; }
      }

      var t;
      if(input){
        input.addEventListener('input', function(){
          clearTimeout(t);
          t = setTimeout(function(){ search(input.value); }, 250);
        });
        search('');
      }
      if(clearBtn){ clearBtn.addEventListener('click', function(){ setIds([]); }); }
      renderChips();
    })();
  </script>
</section>
</html>
