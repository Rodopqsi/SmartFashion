<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;background:#f6f7f9}
    .card{background:#fff;border:1px solid #e6e8eb;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .field{margin-bottom:12px}
    label{display:block;margin-bottom:6px;color:#374151;font-weight:600}
    input{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px}
    button{display:inline-block;background:#111827;color:#fff;border:none;border-radius:8px;padding:10px 14px;cursor:pointer}
    .muted{color:#6b7280;font-size:.9rem}
    .error{color:#b91c1c;margin-bottom:8px}
  </style>
  
  <!-- Evitar redirecciones automáticas que pueden interferir con el flujo de login -->
  
</head>
<body>
  <main class="container" style="max-width:420px;margin:56px auto">
    <div class="card" style="padding:24px">
      <h1 style="margin:0 0 12px">Panel Admin — Iniciar sesión</h1>
      <p class="muted" style="margin:0 0 16px">Usa tus credenciales locales de desarrollo.</p>

      <div th:if="${param.error}" class="error">Usuario o contraseña inválidos.</div>
      <div th:if="${param.logout}" class="muted">Sesión cerrada.</div>

      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" placeholder="admin" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" placeholder="admin123" required />
        </div>
        <button type="submit">Entrar</button>
      </form>
    </div>

    <p class="muted" style="margin-top:16px">
      También puedes usar el inicio de sesión centralizado (SSO) desde Django si está configurado.
    </p>
  </main>
</body>
</html>
