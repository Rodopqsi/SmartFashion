<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout (title='Nuevo producto', content=~{::section})}">
<section>
  <h1>Nuevo producto</h1>
  <form method="post" th:action="@{/admin/products}" th:object="${product}" class="stack">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div class="field">
      <label>Nombre</label>
      <input type="text" th:field="*{nombre}" required />
    </div>
    <div class="field">
      <label>Descripción</label>
      <textarea th:field="*{descripcion}" required></textarea>
    </div>
    <div class="field">
      <label>Precio</label>
      <input type="number" step="0.01" th:field="*{precio}" required />
    </div>
    <div class="field">
      <label>Categoría</label>
      <select th:field="*{categoria}" required>
        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.nombre}"></option>
      </select>
    </div>
    <div class="field">
      <label>Imagen (URL)</label>
      <input type="url" th:field="*{imagePreview}" required />
    </div>
    <div class="grid two">
      <div class="field">
        <label>Talla inicial</label>
        <select name="sizeId" required>
          <option th:each="s : ${sizes}" th:value="${s.id}" th:text="${s.nombre}"></option>
        </select>
      </div>
      <div class="field">
        <label>Color inicial</label>
        <select name="colorId" required>
          <option th:each="c : ${colors}" th:value="${c.id}" th:text="${c.nombre}"></option>
        </select>
      </div>
      <div class="field">
        <label>Stock inicial</label>
        <input type="number" name="stock" min="0" value="0" required />
      </div>
    </div>
    <div th:if="${formError}" style="margin:8px 0;padding:10px;border-radius:8px;background:#FEF2F2;color:#991B1B">[[${formError}]]</div>
    <div class="actions">
      <button class="btn" type="submit">Guardar</button>
      <a class="btn secondary" th:href="@{/admin/products}">Cancelar</a>
    </div>
  </form>
</section>
</html>
