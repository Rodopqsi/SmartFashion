<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout (title='Productos', content=~{::section})}">
<section>
  <div class="header-row">
    <h1>Productos</h1>
    <a class="btn" th:href="@{/admin/products/new}">Nuevo producto</a>
  </div>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Precio</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.categoria != null ? p.categoria.nombre : '-'}"></td>
        <td th:text="${p.precio != null ? #numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT') : '-'}"></td>
        <td><a class="btn secondary" th:href="@{'/admin/products/' + ${p.id} + '/edit'}">Editar</a></td>
      </tr>
    </tbody>
  </table>
</section>
</html>
