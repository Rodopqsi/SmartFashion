<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout (title='Productos', content=~{::section})}">
<section>
  <div class="header-row">
    <h1>Productos</h1>
    <a class="btn" th:href="@{/admin/products/new}">Nuevo producto</a>
  </div>
  <style>
    .filters-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end;margin:10px 0 14px 0}
    @media(max-width:1100px){.filters-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:800px){.filters-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:520px){.filters-grid{grid-template-columns:1fr}}
    .filters-actions{justify-self:end;display:flex;gap:8px}
  </style>
  <form method="get" th:action="@{/admin/products}" class="filters-grid">
    <div class="field">
      <label>Búsqueda</label>
      <input type="text" name="q" th:value="${q}" placeholder="nombre o descripción" />
    </div>
    <div class="field">
      <label>Categoría</label>
      <select name="categoriaId">
        <option value="">(todas)</option>
        <option th:each="c : ${categories}" th:value="${c.id}" th:selected="${categoriaId != null and c.id == categoriaId}" th:text="${c.nombre}"></option>
      </select>
    </div>
    <div class="field">
      <label>Precio mín</label>
      <input type="number" step="0.01" name="precioMin" th:value="${precioMin}" />
    </div>
    <div class="field">
      <label>Precio máx</label>
      <input type="number" step="0.01" name="precioMax" th:value="${precioMax}" />
    </div>
    <div class="filters-actions">
      <button class="btn" type="submit">Filtrar</button>
      <a class="btn secondary" th:href="@{/admin/products}">Limpiar</a>
    </div>
  </form>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Precio</th>
        <th style="width:200px">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.categoria != null ? p.categoria.nombre : '-'}"></td>
        <td th:text="${p.precio != null ? #numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT') : '-'}"></td>
        <td>
          <div class="row" style="gap:6px">
            <a class="btn secondary" th:href="@{'/admin/products/' + ${p.id} + '/edit'}">Editar</a>
            <form method="post" th:action="@{'/admin/products/' + ${p.id} + '/delete'}" onsubmit="return confirm('¿Eliminar producto? Esta acción no se puede deshacer.');">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button class="btn danger" type="submit">Eliminar</button>
            </form>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  <div th:if="${#lists.isEmpty(products)}" style="margin-top:10px;color:#555">No se encontraron productos con los filtros aplicados.</div>
</section>
</html>
