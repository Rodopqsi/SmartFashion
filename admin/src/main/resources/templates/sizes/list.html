<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout (title='Tallas', content=~{::section})}">
<section>
  <div class="header-row">
    <h1>Tallas</h1>
    <form method="post" th:action="@{/admin/sizes}" style="display:flex;gap:8px;align-items:flex-end">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <label>Nombre
        <input type="text" name="nombre" required />
      </label>
      <label>Tipo
        <input type="text" name="tipo" placeholder="ropa/calzado" />
      </label>
      <button class="btn" type="submit">Agregar</button>
    </form>
  </div>
  <table class="table">
    <thead><tr><th>ID</th><th>Nombre</th><th>Tipo</th><th></th></tr></thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(sizes)}"><td colspan="4" class="muted">No hay tallas.</td></tr>
      <tr th:each="s : ${sizes}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.nombre}"></td>
        <td th:text="${s.tipo}"></td>
        <td>
          <form method="post" th:action="@{'/admin/sizes/' + ${s.id} + '/delete'}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn danger" type="submit">Eliminar</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</section>
</html>
