<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout('Detalle Reclamación', ~{::section})">
<section>
  <div class="card" th:if="${claim != null}">
    <h2>Reclamación #<span th:text="${claim.id}"></span></h2>
    <p><strong>Orden:</strong> <span th:text="${claim.orderNumber}"></span></p>
    <p><strong>Email:</strong> <span th:text="${claim.email}"></span></p>
    <p><strong>Teléfono:</strong> <span th:text="${claim.telefono}"></span></p>
    <p><strong>Tipo:</strong> <span th:text="${claim.tipo}"></span></p>
    <p><strong>Detalle:</strong></p>
    <pre th:text="${claim.detalle}" style="white-space:pre-wrap"></pre>

    <form method="post" style="margin-top:1rem">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div class="row">
        <label>Estado</label>
        <select name="estado" th:value="${claim.estado}">
          <option value="registrado" th:selected="${claim.estado == 'registrado'}">Registrado</option>
          <option value="en_proceso" th:selected="${claim.estado == 'en_proceso'}">En proceso</option>
          <option value="resuelto" th:selected="${claim.estado == 'resuelto'}">Resuelto</option>
          <option value="rechazado" th:selected="${claim.estado == 'rechazado'}">Rechazado</option>
        </select>
      </div>
      <div class="row">
        <label>Respuesta</label>
        <textarea name="respuesta" rows="4" th:text="${claim.respuesta}"></textarea>
      </div>
      <button class="btn" type="submit">Guardar</button>
      <a class="btn secondary" th:href="@{/admin/support/claims}">Volver</a>
    </form>
  </div>
  <div class="card" th:if="${claim == null}">No encontrado</div>
</section>
</html>
