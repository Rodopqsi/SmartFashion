version: "3.8"
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sf_net

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - ./.env
    volumes:
      - ../cliente/backend:/app
    depends_on:
      - db
    networks:
      - sf_net

  admin:
    build:
      context: ..
      dockerfile: deploy/docker/admin.Dockerfile
    env_file:
      - ./.env
    environment:
      - SPRING_SERVER_FORWARD_HEADERS_STRATEGY=${SERVER_FORWARD_HEADERS_STRATEGY}
      # Database connection (point to the docker-compose `db` service)
      - DB_URL=${DB_URL:jdbc:mysql://db:3306/smarthfashion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      - DB_USER=${DB_USER:root}
      - DB_PASS=${DB_PASS:}
      # Ensure SSO/base URL use the correct external host if not provided via .env
      - SSO_LOGIN_URL=${SSO_LOGIN_URL:https://smarthfashion.shop/admin/login}
      - APP_BASE_URL=${APP_BASE_URL:https://smarthfashion.shop}
    depends_on:
      - db
    networks:
      - sf_net

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    env_file:
      - ./.env
    depends_on:
      - backend
    networks:
      - sf_net

  proxy:
    image: nginx:1.25
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - frontend_static:/usr/share/nginx/html:ro
      - certs:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
      - admin
    links:
      - frontend
      - backend
      - admin
    networks:
      - sf_net

volumes:
  db_data:
  frontend_static:
  certs:

networks:
  sf_net:
    driver: bridge
