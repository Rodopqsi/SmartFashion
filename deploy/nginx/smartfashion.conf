server {
  listen 80;
  server_name smarthfashion.shop www.smarthfashion.shop;

  # Let Certbot validate and then we will enable HTTPS
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA client routes - rewrite to frontend root so index.html is returned
  location ~ ^/(login|register|collections|favorites|cart|products|categories)/?$ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # rewrite matched SPA paths to root so the frontend returns index.html
    rewrite ^/(.*)$ / break;
    proxy_pass http://frontend:80;
    proxy_redirect off;
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Note: remove explicit /login proxy so the frontend SPA handles /login and /register

  # Route SSO callbacks to the Spring admin service
  location /sso/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://admin:8081/sso/;
    proxy_redirect http://admin:8081/sso/ /sso/;
    proxy_cookie_domain admin smarthfashion.shop;
    proxy_cookie_path / /;
  }

  location /admin/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_pass http://admin:8081/;
    proxy_redirect http://admin:8081/ /admin/;
    proxy_cookie_domain admin smarthfashion.shop;
    proxy_cookie_path / /;
  }

  # Serve admin static assets through the admin service so templates using /css/admin.css work
  location = /css/admin.css {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://admin:8081/css/admin.css;
    proxy_redirect off;
  }

  location ^~ /admin/css/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://admin:8081/css/;
    proxy_redirect off;
  }

  # Fallback for client-side (SPA) routes not handled above.
  # Rewrites unknown frontend routes to root so the SPA can handle routing.
  location ~ ^/(?!api/|admin/|sso/|css/|assets/|img/|favicon.ico).+ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # rewrite the path to root so frontend serves index.html
    rewrite ^/(.*)$ / break;
    proxy_pass http://frontend:80;
    proxy_redirect off;
  }
}
