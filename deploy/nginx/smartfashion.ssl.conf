server {
  listen 443 ssl;
  server_name smarthfashion.shop www.smarthfashion.shop;

  ssl_certificate /etc/letsencrypt/live/smarthfashion.shop/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/smarthfashion.shop/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Login/Logout handling to avoid clashing with SPA routes:
  # - GET /login -> frontend SPA
  # - POST /login -> proxy to admin /login
  # - POST /logout -> proxy to admin /logout
  location = /login {
    if ($request_method = POST) { return 307 /__admin_login_post; }
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://frontend:80;
    proxy_redirect off;
  }

  location = /__admin_login_post {
    internal;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://admin:8081/login;
    proxy_redirect http://admin:8081/login /login;
    proxy_cookie_domain admin smarthfashion.shop;
    proxy_cookie_path / /;
  }

  location = /logout {
    if ($request_method = POST) { return 307 /__admin_logout_post; }
    return 405; # only POST is supported by Spring Security by default
  }

  location = /__admin_logout_post {
    internal;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://admin:8081/logout;
    proxy_redirect http://admin:8081/logout /logout;
    proxy_cookie_domain admin smarthfashion.shop;
    proxy_cookie_path / /;
  }

  # SPA client routes - rewrite to frontend root so index.html is returned
  location ~ ^/(login|register|collections|favorites|cart|products|categories)/?$ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # rewrite matched SPA paths to root so the frontend returns index.html
    rewrite ^/(.*)$ / break;
    proxy_pass http://frontend:80;
    proxy_redirect off;
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Note: do not proxy /login to admin here; let the frontend SPA handle /login and /register

  # Route SSO callbacks to the Spring admin service
  location /sso/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://admin:8081/sso/;
    proxy_redirect http://admin:8081/sso/ /sso/;
    proxy_cookie_domain admin smarthfashion.shop;
    proxy_cookie_path / /;
  }

  location /admin/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    # Preserve the /admin prefix when proxying (no trailing slash in proxy_pass)
    proxy_pass http://admin:8081;
    proxy_redirect off;
    proxy_cookie_domain admin smarthfashion.shop;
    proxy_cookie_path / /;
  }

  # Serve admin static assets through the admin service so templates using /css/admin.css work
  location = /css/admin.css {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://admin:8081/css/admin.css;
    proxy_redirect off;
  }

  location ^~ /admin/css/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://admin:8081/css/;
    proxy_redirect off;
  }

  # Fallback for client-side (SPA) routes not handled above.
  # Rewrites unknown frontend routes to root so the SPA can handle routing.
  location ~ ^/(?!api/|admin/|sso/|css/|assets/|img/|favicon.ico).+ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    rewrite ^/(.*)$ / break;
    proxy_pass http://frontend:80;
    proxy_redirect off;
  }

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
